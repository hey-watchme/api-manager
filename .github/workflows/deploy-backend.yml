name: Deploy Backend API to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: watchme-api-manager-backend
  AWS_ACCOUNT_ID: 754724220380
  SERVICE_NAME: api-manager-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'true'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔨 Building Backend API Docker image..."

        docker buildx build \
          --platform linux/arm64 \
          --no-cache \
          --push \
          -f Dockerfile.backend \
          -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
          -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
          .

        echo "✅ Image pushed to ECR:"
        echo "  - $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
        echo "  - $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

    - name: Add EC2 to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 3.24.16.82 >> ~/.ssh/known_hosts

    - name: Deploy to EC2 instance
      run: |
        echo "🚀 Starting Backend API deployment to EC2..."

        ssh ubuntu@3.24.16.82 << 'ENDSSH'
          set -e
          echo "📦 Starting API Manager Backend deployment..."

          # ECR login
          echo "🔑 Logging in to ECR..."
          aws ecr get-login-password --region ap-southeast-2 | \
            docker login --username AWS --password-stdin 754724220380.dkr.ecr.ap-southeast-2.amazonaws.com

          # Stop and remove ALL related containers (old scheduler + new backend)
          echo "🛑 Stopping and removing old containers..."
          docker stop api-manager-backend 2>/dev/null || true
          docker rm api-manager-backend 2>/dev/null || true
          docker stop watchme-scheduler-prod 2>/dev/null || true
          docker rm watchme-scheduler-prod 2>/dev/null || true

          # Remove old images
          echo "🗑️ Removing old images..."
          docker images | grep "754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager-backend" | \
            awk '{print $3}' | xargs -r docker rmi -f
          docker images | grep "754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager-scheduler" | \
            awk '{print $3}' | xargs -r docker rmi -f

          # Pull the latest image
          echo "📥 Pulling latest image from ECR..."
          docker pull --platform linux/arm64 \
            754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager-backend:latest

          # Ensure Docker network exists
          echo "🌐 Ensuring Docker network exists..."
          docker network create watchme-network 2>/dev/null || true

          # Start new container
          echo "🚀 Starting new container..."
          docker run -d \
            --name api-manager-backend \
            --network watchme-network \
            -p 8015:8015 \
            --restart unless-stopped \
            754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager-backend:latest

          # Container status check
          echo "📊 Checking container status..."
          sleep 5
          if docker ps | grep api-manager-backend; then
            echo "✅ Container started successfully!"
            docker logs api-manager-backend --tail 20
          else
            echo "❌ Container failed to start!"
            docker logs api-manager-backend --tail 50
            exit 1
          fi

          echo "✅ EC2 deployment completed successfully!"
        ENDSSH

    - name: Verify API endpoint
      run: |
        echo "🔍 Verifying API endpoint..."
        sleep 10

        if curl -f http://3.24.16.82:8015/health > /dev/null 2>&1; then
          echo "✅ Backend API is accessible!"
        else
          echo "⚠️ Health check failed, but container may still be starting"
        fi