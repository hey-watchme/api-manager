name: Deploy Frontend to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:  # Manual trigger option

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: watchme-api-manager
  AWS_ACCOUNT_ID: 754724220380
  SERVICE_NAME: api-manager-frontend

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Delete old images from ECR (cleanup)
      run: |
        echo "🧹 Cleaning up old images in ECR..."
        aws ecr batch-delete-image \
          --region ${{ env.AWS_REGION }} \
          --repository-name ${{ env.ECR_REPOSITORY }} \
          --image-ids imageTag=latest || true

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔨 Building Docker image with --no-cache..."

        # Build with no cache to ensure fresh build
        docker buildx build \
          --platform linux/arm64 \
          --no-cache \
          --push \
          -f Dockerfile \
          -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
          -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
          .

        echo "✅ Image pushed to ECR:"
        echo "  - $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
        echo "  - $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

    - name: Build Success Notification
      if: success()
      run: |
        echo "🎉 Build and push to ECR succeeded!"
        echo "📦 Repository: ${{ env.ECR_REPOSITORY }}"
        echo "🏷️ Image Tag: ${{ github.sha }}"
        echo "📍 Region: ${{ env.AWS_REGION }}"

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

    - name: Add EC2 to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 3.24.16.82 >> ~/.ssh/known_hosts

    - name: Deploy to EC2 instance
      run: |
        echo "🚀 Starting deployment to EC2..."

        # SSH to EC2 and execute deployment commands
        ssh ubuntu@3.24.16.82 << 'ENDSSH'
          set -e
          echo "📦 Starting API Manager Frontend deployment..."

          # ECR login
          echo "🔑 Logging in to ECR..."
          aws ecr get-login-password --region ap-southeast-2 | \
            docker login --username AWS --password-stdin 754724220380.dkr.ecr.ap-southeast-2.amazonaws.com

          # Stop and remove ALL related containers
          echo "🛑 Stopping and removing old containers..."
          docker stop api-manager-frontend 2>/dev/null || true
          docker rm api-manager-frontend 2>/dev/null || true
          docker stop watchme-api-manager-prod 2>/dev/null || true
          docker rm watchme-api-manager-prod 2>/dev/null || true
          docker stop watchme-scheduler-prod 2>/dev/null || true
          docker rm watchme-scheduler-prod 2>/dev/null || true

          # Remove ALL old images to force fresh pull
          echo "🗑️ Removing ALL old api-manager images..."
          docker images | grep "754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager" | \
            awk '{print $3}' | xargs -r docker rmi -f

          # Pull the latest image with --platform flag
          echo "📥 Pulling latest image from ECR..."
          docker pull --platform linux/arm64 \
            754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager:latest

          # Ensure Docker network exists
          echo "🌐 Ensuring Docker network exists..."
          docker network create watchme-network 2>/dev/null || true

          # Start new container
          echo "🚀 Starting new container..."
          docker run -d \
            --name api-manager-frontend \
            --network watchme-network \
            -p 9001:9001 \
            --restart unless-stopped \
            754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-api-manager:latest

          # Container status check
          echo "📊 Checking container status..."
          sleep 5
          if docker ps | grep api-manager-frontend; then
            echo "✅ Container started successfully!"

            # Check logs
            echo "📝 Recent container logs:"
            docker logs api-manager-frontend --tail 20

            # Basic health check
            echo "🏥 Performing health check..."
            for i in {1..6}; do
              if curl -f http://localhost:9001/ > /dev/null 2>&1; then
                echo "✅ Health check passed (attempt $i/6)"
                break
              fi
              echo "  Attempt $i/6 failed, retrying in 5 seconds..."
              sleep 5
            done
          else
            echo "❌ Container failed to start!"
            docker logs api-manager-frontend --tail 50
            exit 1
          fi

          echo "✅ EC2 deployment completed successfully!"
        ENDSSH

    - name: Verify External URL
      run: |
        echo "🔍 Verifying external URL..."
        sleep 10

        # Check if the site is accessible
        if curl -f https://api.hey-watch.me/manager/ > /dev/null 2>&1; then
          echo "✅ External URL is accessible!"

          # Check for the new JavaScript file
          echo "📄 Checking deployed version..."
          CONTENT=$(curl -s https://api.hey-watch.me/manager/)
          echo "$CONTENT" | grep -o 'index-[a-zA-Z0-9_-]*\.js' | head -1

          # Check for new features
          if echo "$CONTENT" | grep -q "index-CXFWiWfP.js"; then
            echo "⚠️ WARNING: Old version still deployed!"
            echo "Old file detected: index-CXFWiWfP.js"
          else
            echo "✅ New version successfully deployed!"
          fi
        else
          echo "❌ External URL verification failed"
          exit 1
        fi

    - name: Deployment Success Notification
      if: success()
      run: |
        echo "🎉 Full deployment pipeline completed successfully!"
        echo "📦 Service: ${{ env.SERVICE_NAME }}"
        echo "🌐 URL: https://api.hey-watch.me/manager/"
        echo "🏷️ Version: ${{ github.sha }}"
        echo ""
        echo "📊 New features deployed:"
        echo "  - SQS Status Dashboard"
        echo "  - Tab renamed: 📊 ダッシュボード"
        echo "  - Tab renamed: 📝 プロンプト生成"